<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作物の生育記録 (Plant Growth Tracker)</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js for Growth Visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: #f3f4f6;
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen text-gray-800 flex flex-col">

    <header class="bg-emerald-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-white text-emerald-700 p-2 rounded-lg font-bold text-xl shadow">
                    <i class="fa-solid font-bold fa-seedling"></i>
                </div>
                <h1 class="text-xl font-bold tracking-wide">作物の生育記録</h1>
            </div>

            <!-- User Auth Bar -->
            <div id="authArea" class="flex items-center space-x-3">
                <div id="userInfo" class="hidden flex items-center space-x-3">
                    <img id="userAvatar" class="w-8 h-8 rounded-full border-2 border-emerald-300" src="" alt="User Avatar">
                    <span id="userName" class="text-sm font-medium hidden sm:inline"></span>
                    <button id="logoutBtn" class="bg-emerald-800 hover:bg-emerald-900 text-xs px-3 py-1.5 rounded-lg border border-emerald-600 transition flex items-center gap-1">
                        <i class="fa-solid fa-right-from-bracket"></i> ログアウト
                    </button>
                </div>
                <button id="loginBtn" class="bg-white text-emerald-700 hover:bg-emerald-50 text-sm font-bold px-4 py-2 rounded-lg shadow transition flex items-center gap-2">
                    <i class="fa-brands fa-google text-red-500"></i> Googleでログイン
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-6xl w-full mx-auto p-4 sm:p-6">
        
        <!-- Welcome banner when logged out -->
        <div id="loggedOutBanner" class="bg-white rounded-2xl p-8 shadow-sm text-center border border-gray-100 my-8">
            <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                <i class="fa-solid fa-sprout"></i>
            </div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">生育記録をはじめましょう</h2>
            <p class="text-gray-600 max-w-md mx-auto mb-6">作物名、葉枚数、草丈などの日々の成長データをクラウドに安全に保存・記録できます。</p>
            <button id="bannerLoginBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-3 rounded-xl shadow-lg transition flex items-center gap-2 mx-auto">
                <i class="fa-brands fa-google"></i> Googleアカウントでログインして利用を開始
            </button>
        </div>

        <!-- App Container (Shown when logged in) -->
        <div id="appContent" class="hidden space-y-6">

            <!-- Top Grid: Form and Growth Chart -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                
                <div class="lg:col-span-5 bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                    <h2 id="formTitle" class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-pen-to-square text-emerald-600"></i> 生育データを入力
                    </h2>

                    <form id="recordForm" class="space-y-4">
                        <input type="hidden" id="editDocId" value="">

                        <!-- 作物名 -->
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1" for="cropName">
                                作物名 <span class="text-red-500">*</span>
                            </label>
                            <input type="text" id="cropName" required list="cropNameSuggestions" placeholder="例: トマト, キュウリ, ナス"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition text-sm">
                            <datalist id="cropNameSuggestions"></datalist>
                        </div>

                        <!-- 葉枚数 & 草丈 -->
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1" for="leafCount">
                                    葉枚数 (枚)
                                </label>
                                <input type="number" id="leafCount" step="1" min="0" placeholder="0"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1" for="plantHeight">
                                    草丈 (cm)
                                </label>
                                <input type="number" id="plantHeight" step="0.1" min="0" placeholder="0.0"
                                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition text-sm">
                            </div>
                        </div>

                        <!-- 日付 -->
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1" for="recordDate">
                                日付 <span class="text-red-500">*</span>
                            </label>
                            <input type="date" id="recordDate" required
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition text-sm">
                        </div>

                        <!-- メモ -->
                        <div>
                            <label class="block text-xs font-semibold text-gray-600 mb-1" for="memo">
                                メモ (複数行)
                            </label>
                            <textarea id="memo" rows="3" placeholder="水やり、追肥、病害虫の有無など..."
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition text-sm"></textarea>
                        </div>

                        <!-- Form Action Buttons -->
                        <div class="flex gap-2 pt-2">
                            <button type="submit" id="submitBtn" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-4 rounded-lg shadow transition flex items-center justify-center gap-2 text-sm">
                                <i class="fa-solid fa-plus"></i> 記録を保存
                            </button>
                            <button type="button" id="cancelEditBtn" class="hidden bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2.5 px-4 rounded-lg transition text-sm">
                                キャンセル
                            </button>
                        </div>
                    </form>
                </div>

                <div class="lg:col-span-7 bg-white rounded-2xl shadow-sm border border-gray-100 p-6 flex flex-col">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                            <i class="fa-solid fa-chart-line text-emerald-600"></i> 生育グラフトレンド
                        </h2>
                        <select id="chartCropFilter" class="text-xs bg-gray-50 border border-gray-300 rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            <option value="">全作物</option>
                        </select>
                    </div>
                    
                    <div class="flex-grow flex items-center justify-center relative min-h-[220px]">
                        <canvas id="growthChart"></canvas>
                        <div id="chartNoData" class="absolute inset-0 flex items-center justify-center text-gray-400 text-sm">
                            記録データが十分ではありません
                        </div>
                    </div>
                </div>

            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 space-y-4">
                
                <!-- Filter Bar -->
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 pb-4 border-b border-gray-100">
                    <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-emerald-600"></i> 生育記録一覧
                    </h2>
                    
                    <div class="flex items-center space-x-2 w-full sm:w-auto">
                        <div class="relative w-full sm:w-48">
                            <i class="fa-solid fa-filter absolute left-3 top-2.5 text-gray-400 text-xs"></i>
                            <select id="listCropFilter" class="w-full text-xs pl-8 pr-3 py-2 bg-gray-50 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                                <option value="">すべての作物</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Log Items Grid/Table -->
                <div id="recordsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Dynamic rendering via JS -->
                </div>

                <div id="noRecords" class="hidden text-center py-12 text-gray-400">
                    <i class="fa-solid fa-inbox text-4xl mb-2"></i>
                    <p class="text-sm">該当する記録が見つかりません</p>
                </div>

            </div>

        </div>

    </main>

    <!-- Toast Notification container -->
    <div id="toast" class="fixed bottom-5 right-5 transform translate-y-20 opacity-0 transition-all duration-300 bg-gray-900 text-white px-4 py-3 rounded-xl shadow-xl flex items-center space-x-3 z-50">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMessage" class="text-sm font-medium">メッセージ</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            GoogleAuthProvider, 
            signInWithPopup, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            updateDoc, 
            deleteDoc, 
            doc, 
            onSnapshot, 
            query, 
            where, 
            orderBy, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Configuration (User provided)
        const firebaseConfig = {
            apiKey: "AIzaSyDKa6Bne62v2yEPQR4KP-izdtdzU05tQpU",
            authDomain: "plantcheck-36541.firebaseapp.com",
            projectId: "plantcheck-36541",
            storageBucket: "plantcheck-36541.firebasestorage.app",
            messagingSenderId: "320688507140",
            appId: "1:320688507140:web:2c2c95340c474ee15ea851",
            measurementId: "G-WFC49F6WZC"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // App state
        let currentUser = null;
        let unsubscribeRecords = null;
        let currentRecords = [];
        let growthChart = null;

        // DOM Elements
        const loginBtn = document.getElementById('loginBtn');
        const bannerLoginBtn = document.getElementById('bannerLoginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const userInfo = document.getElementById('userInfo');
        const userName = document.getElementById('userName');
        const userAvatar = document.getElementById('userAvatar');
        const loggedOutBanner = document.getElementById('loggedOutBanner');
        const appContent = document.getElementById('appContent');
        const recordForm = document.getElementById('recordForm');
        const recordDateInput = document.getElementById('recordDate');
        const listCropFilter = document.getElementById('listCropFilter');
        const chartCropFilter = document.getElementById('chartCropFilter');
        const cropNameSuggestions = document.getElementById('cropNameSuggestions');
        const cancelEditBtn = document.getElementById('cancelEditBtn');

        window.addEventListener('DOMContentLoaded', () => {
            // Set default date picker to today
            const today = new Date().toISOString().split('T')[0];
            recordDateInput.value = today;

            // Auth Event Listeners
            loginBtn.addEventListener('click', handleLogin);
            bannerLoginBtn.addEventListener('click', handleLogin);
            logoutBtn.addEventListener('click', handleLogout);

            // Form Submit Listener
            recordForm.addEventListener('submit', handleFormSubmit);
            cancelEditBtn.addEventListener('click', resetForm);

            // Filter Event Listeners
            listCropFilter.addEventListener('change', renderRecords);
            chartCropFilter.addEventListener('change', updateChart);

            // Initialize Chart
            initChart();
        });

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                // UI changes for Logged-In User
                userName.textContent = user.displayName || user.email;
                userAvatar.src = user.photoURL || 'https://via.placeholder.com/40';
                userInfo.classList.remove('hidden');
                loginBtn.classList.add('hidden');
                loggedOutBanner.classList.add('hidden');
                appContent.classList.remove('hidden');

                // Start Listening to Firestore
                listenToRecords();
                showToast('ログインしました', 'success');
            } else {
                // UI changes for Logged-Out State
                userInfo.classList.add('hidden');
                loginBtn.classList.remove('hidden');
                loggedOutBanner.classList.remove('hidden');
                appContent.classList.add('hidden');

                if (unsubscribeRecords) unsubscribeRecords();
                currentRecords = [];
            }
        });

        async function handleLogin() {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("Login Error:", error);
                showToast('ログインに失敗しました', 'error');
            }
        }

        async function handleLogout() {
            try {
                await signOut(auth);
                showToast('ログアウトしました', 'info');
            } catch (error) {
                console.error("Logout Error:", error);
            }
        }

        function listenToRecords() {
            if (!currentUser) return;

            // Simple query avoiding composite index requirements
            const recordsRef = collection(db, 'records');
            const q = query(recordsRef, where('userId', '==', currentUser.uid));

            unsubscribeRecords = onSnapshot(q, (snapshot) => {
                currentRecords = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));

                // In-memory sort by date descending
                currentRecords.sort((a, b) => new Date(b.date) - new Date(a.date));

                updateCropDropdowns();
                renderRecords();
                updateChart();
            }, (error) => {
                console.error("Firestore Error:", error);
                showToast('データの取得に失敗しました', 'error');
            });
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            if (!currentUser) return;

            const editDocId = document.getElementById('editDocId').value;
            const cropName = document.getElementById('cropName').value.trim();
            const leafCount = document.getElementById('leafCount').value;
            const plantHeight = document.getElementById('plantHeight').value;
            const date = document.getElementById('recordDate').value;
            const memo = document.getElementById('memo').value.trim();

            const recordData = {
                userId: currentUser.uid,
                cropName,
                leafCount: leafCount !== '' ? Number(leafCount) : null,
                plantHeight: plantHeight !== '' ? Number(plantHeight) : null,
                date,
                memo,
                updatedAt: serverTimestamp()
            };

            try {
                if (editDocId) {
                    // Update Record
                    await updateDoc(doc(db, 'records', editDocId), recordData);
                    showToast('記録を更新しました');
                } else {
                    // Add New Record
                    recordData.createdAt = serverTimestamp();
                    await addDoc(collection(db, 'records'), recordData);
                    showToast('新しい記録を保存しました');
                }
                resetForm();
            } catch (error) {
                console.error("Save Error:", error);
                showToast('保存中にエラーが発生しました', 'error');
            }
        }

        // Edit Record Handler
        window.editRecord = function(id) {
            const item = currentRecords.find(r => r.id === id);
            if (!item) return;

            document.getElementById('editDocId').value = item.id;
            document.getElementById('cropName').value = item.cropName || '';
            document.getElementById('leafCount').value = item.leafCount !== null ? item.leafCount : '';
            document.getElementById('plantHeight').value = item.plantHeight !== null ? item.plantHeight : '';
            document.getElementById('recordDate').value = item.date || '';
            document.getElementById('memo').value = item.memo || '';

            document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-pen-to-square text-emerald-600"></i> 生育記録を編集';
            document.getElementById('submitBtn').innerHTML = '<i class="fa-solid fa-check"></i> 変更を更新';
            cancelEditBtn.classList.remove('hidden');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // Delete Record Handler
        window.deleteRecord = async function(id) {
            if (!confirm('この記録を削除してもよろしいですか？')) return;

            try {
                await deleteDoc(doc(db, 'records', id));
                showToast('記録を削除しました', 'info');
            } catch (error) {
                console.error("Delete Error:", error);
                showToast('削除に失敗しました', 'error');
            }
        };

        function resetForm() {
            recordForm.reset();
            document.getElementById('editDocId').value = '';
            document.getElementById('recordDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('formTitle').innerHTML = '<i class="fa-solid fa-pen-to-square text-emerald-600"></i> 生育データを入力';
            document.getElementById('submitBtn').innerHTML = '<i class="fa-solid fa-plus"></i> 記録を保存';
            cancelEditBtn.classList.add('hidden');
        }

        function renderRecords() {
            const container = document.getElementById('recordsList');
            const noRecords = document.getElementById('noRecords');
            const selectedFilter = listCropFilter.value;

            const filtered = selectedFilter 
                ? currentRecords.filter(r => r.cropName === selectedFilter)
                : currentRecords;

            if (filtered.length === 0) {
                container.innerHTML = '';
                noRecords.classList.remove('hidden');
                return;
            }

            noRecords.classList.add('hidden');
            container.innerHTML = filtered.map(item => `
                <div class="bg-gray-50 hover:bg-white border border-gray-200 hover:border-emerald-300 rounded-xl p-4 transition shadow-sm hover:shadow relative group flex flex-col justify-between animate-fade-in">
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="inline-block bg-emerald-100 text-emerald-800 text-xs font-semibold px-2.5 py-1 rounded-md">
                                ${escapeHtml(item.cropName)}
                            </span>
                            <span class="text-xs font-medium text-gray-500">
                                <i class="fa-regular fa-calendar mr-1"></i>${escapeHtml(item.date)}
                            </span>
                        </div>

                        <!-- Stats Grid -->
                        <div class="grid grid-cols-2 gap-2 my-3 text-center">
                            <div class="bg-white p-2 rounded-lg border border-gray-100">
                                <div class="text-xs text-gray-400">葉枚数</div>
                                <div class="text-base font-bold text-gray-700">
                                    ${item.leafCount !== null ? item.leafCount + ' <span class="text-xs font-normal">枚</span>' : '-'}
                                </div>
                            </div>
                            <div class="bg-white p-2 rounded-lg border border-gray-100">
                                <div class="text-xs text-gray-400">草丈</div>
                                <div class="text-base font-bold text-gray-700">
                                    ${item.plantHeight !== null ? item.plantHeight + ' <span class="text-xs font-normal">cm</span>' : '-'}
                                </div>
                            </div>
                        </div>

                        ${item.memo ? `
                            <p class="text-xs text-gray-600 bg-white p-2.5 rounded-lg border border-gray-100 whitespace-pre-wrap mb-3 leading-relaxed">
                                ${escapeHtml(item.memo)}
                            </p>
                        ` : ''}
                    </div>

                    <!-- Action buttons -->
                    <div class="flex justify-end space-x-2 pt-2 border-t border-gray-100">
                        <button onclick="editRecord('${item.id}')" class="text-xs text-gray-500 hover:text-emerald-600 px-2 py-1 rounded transition flex items-center gap-1">
                            <i class="fa-solid fa-pen"></i> 編集
                        </button>
                        <button onclick="deleteRecord('${item.id}')" class="text-xs text-gray-500 hover:text-red-600 px-2 py-1 rounded transition flex items-center gap-1">
                            <i class="fa-solid fa-trash-can"></i> 削除
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function updateCropDropdowns() {
            const crops = [...new Set(currentRecords.map(r => r.cropName))].filterBoolean();
            
            // Datalist for autocomplete
            cropNameSuggestions.innerHTML = crops.map(c => `<option value="${escapeHtml(c)}">`).join('');

            // Save selected values
            const prevListVal = listCropFilter.value;
            const prevChartVal = chartCropFilter.value;

            // List Filter Dropdown
            listCropFilter.innerHTML = '<option value="">すべての作物</option>' + 
                crops.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
            listCropFilter.value = crops.includes(prevListVal) ? prevListVal : '';

            // Chart Filter Dropdown
            chartCropFilter.innerHTML = '<option value="">全作物 (草丈)</option>' + 
                crops.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
            chartCropFilter.value = crops.includes(prevChartVal) ? prevChartVal : '';
        }

        function initChart() {
            const ctx = document.getElementById('growthChart').getContext('2d');
            growthChart = new Chart(ctx, {
                type: 'line',
                data: { labels: [], datasets: [] },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'top' },
                        tooltip: { mode: 'index', intersect: false }
                    },
                    scales: {
                        x: { grid: { display: false } },
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        function updateChart() {
            if (!growthChart) return;

            const selectedCrop = chartCropFilter.value;
            const chartNoData = document.getElementById('chartNoData');

            let filtered = [...currentRecords];
            if (selectedCrop) {
                filtered = filtered.filter(r => r.cropName === selectedCrop);
            }

            // Chronological sort for timeline chart
            filtered.sort((a, b) => new Date(a.date) - new Date(b.date));

            if (filtered.length === 0) {
                chartNoData.classList.remove('hidden');
                growthChart.data.labels = [];
                growthChart.data.datasets = [];
                growthChart.update();
                return;
            }

            chartNoData.classList.add('hidden');
            const dates = [...new Set(filtered.map(r => r.date))];

            if (selectedCrop) {
                // Single Crop Mode: Display both Height and Leaf Count
                const heightData = dates.map(d => {
                    const found = filtered.find(r => r.date === d);
                    return found ? found.plantHeight : null;
                });
                const leafData = dates.map(d => {
                    const found = filtered.find(r => r.date === d);
                    return found ? found.leafCount : null;
                });

                growthChart.data.labels = dates;
                growthChart.data.datasets = [
                    {
                        label: '草丈 (cm)',
                        data: heightData,
                        borderColor: '#059669',
                        backgroundColor: 'rgba(5, 150, 105, 0.1)',
                        tension: 0.3,
                        fill: true
                    },
                    {
                        label: '葉枚数 (枚)',
                        data: leafData,
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        tension: 0.3,
                        fill: false
                    }
                ];
            } else {
                // Multi Crop Mode: Compare Plant Heights across crops
                const crops = [...new Set(filtered.map(r => r.cropName))];
                const colors = ['#059669', '#3b82f6', '#f59e0b', '#ec4899', '#8b5cf6'];

                const datasets = crops.map((crop, idx) => {
                    const cropRecords = filtered.filter(r => r.cropName === crop);
                    const data = dates.map(d => {
                        const rec = cropRecords.find(r => r.date === d);
                        return rec ? rec.plantHeight : null;
                    });

                    return {
                        label: `${crop} (草丈 cm)`,
                        data,
                        borderColor: colors[idx % colors.length],
                        tension: 0.3,
                        fill: false
                    };
                });

                growthChart.data.labels = dates;
                growthChart.data.datasets = datasets;
            }

            growthChart.update();
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMessage.textContent = message;

            if (type === 'error') {
                toastIcon.className = 'fa-solid fa-circle-xmark text-red-400';
            } else if (type === 'info') {
                toastIcon.className = 'fa-solid fa-circle-info text-blue-400';
            } else {
                toastIcon.className = 'fa-solid fa-circle-check text-emerald-400';
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
